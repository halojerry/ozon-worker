name: Distribute Skill to COS

# 独立分发 workflow（参考 pounding 仓库 release-distribute.yml 架构）：
#   GitHub Release 发布后，从 Release 下载 tar.gz（GitHub 内网快）
#   → coscli 上传到腾讯云 COS（自动更新分发渠道）。
# 独立触发的好处：与 build 解耦，上传失败可单独 workflow_dispatch 重试。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to redistribute (e.g. v0.12.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skill-distribute-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Distribute skill to COS
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag from event
        id: version
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG / Version: $VERSION"

      - name: Download skill package from Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          TARGET="pounding-ozon-probe-v${VERSION}.tar.gz"
          echo "Downloading $TARGET"
          # ⚠️ 手动兜底分发：仅用于补发已存在 Release 的旧版本。
          # v0.18.0 起正常发布由 build-skill 产包后直传 COS，不再走本工作流。
          ASSET_URL=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq ".assets[] | select(.name == \"$TARGET\") | .url" 2>/dev/null | head -1)
          if [ -z "$ASSET_URL" ]; then
            echo "::error::Release $TAG 下未找到资产 $TARGET，请确认该版本已构建完成"
            exit 1
          fi
          gh api --header "Accept: application/octet-stream" "$ASSET_URL" > "dist/$TARGET"
          ls -lh dist/
          test -f "dist/$TARGET" || {
            echo "::error::版本包 $TARGET 未找到"
            exit 1
          }

      - name: Install coscli
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          chmod 755 coscli
          ./coscli --version

      - name: Compute sha256 and generate manifest
        id: manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="pounding-ozon-probe-v${VERSION}.tar.gz"
          SHA=$(sha256sum "dist/$PKG" | awk '{print $1}')
          # manifest url 用 COS_MANIFEST_BASE_URL（公网域名，不带 bucket）
          cat > manifest.json <<EOF
          {"version": "$VERSION", "url": "${COS_MANIFEST_BASE_URL}/pounding-ozon-probe-v${VERSION}.tar.gz", "sha256": "$SHA", "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "notes": "自动更新发布（GitHub Actions v${VERSION}）"}
          EOF
          echo "SHA256: $SHA"
          echo "PKG=$PKG"
          cat manifest.json
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"
        env:
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}

      - name: Upload to Tencent COS
        timeout-minutes: 60   # 跨境上传可能偶发慢；3 次重试 + 60 分钟上限
        run: |
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.${COS_REGION}.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }
          PKG="${{ steps.manifest.outputs.package_name }}"
          UPLOADED=0
          for attempt in 1 2 3; do
            echo "⏳ COS 上传尝试 $attempt/3: ${PKG} + manifest.json"
            if coscli_cmd cp "dist/${PKG}" "cos://${COS_BUCKET}/ozon-skill/${PKG}" \
               && coscli_cmd cp "manifest.json" "cos://${COS_BUCKET}/ozon-skill/manifest.json"; then
              UPLOADED=1
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          if [ "$UPLOADED" -ne 1 ]; then
            echo "::error::COS 上传 3 次均失败"
            exit 1
          fi
          echo "✅ 已上传: /ozon-skill/${PKG} + /ozon-skill/manifest.json"
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}

      - name: Verify public endpoints
        run: |
          BASE="${COS_MANIFEST_BASE_URL:-https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/ozon-skill}"
          PKG="${{ steps.manifest.outputs.package_name }}"
          for URL in "${BASE}/manifest.json" "${BASE}/${PKG}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "GET $URL → HTTP $CODE"
            test "$CODE" = "200" || { echo "::error::Public endpoint not reachable"; exit 1; }
          done
          LOCAL_SHA=$(sha256sum "dist/$PKG" | awk '{print $1}')
          REMOTE_SHA=$(curl -s -L "${BASE}/${PKG}" | sha256sum | awk '{print $1}')
          echo "local=${LOCAL_SHA} remote=${REMOTE_SHA}"
          test "$LOCAL_SHA" = "$REMOTE_SHA" || {
            echo "::error::COS 包 sha256 与 Release 资产不一致"; exit 1; }
          echo "✅ COS 公网端点验证通过"
        env:
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
