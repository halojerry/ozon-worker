name: Distribute Skill to COS

# 独立分发 workflow（参考 pounding 仓库 release-distribute.yml 架构）：
#   GitHub Release 发布后，从 Release 下载 tar.gz（GitHub 内网快）
#   → coscli 上传到腾讯云 COS（自动更新分发渠道）。
# 独立触发的好处：与 build 解耦，上传失败可单独 workflow_dispatch 重试。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to redistribute (e.g. v0.12.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skill-distribute-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Distribute skill to COS
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag from event
        id: version
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG / Version: $VERSION"

      - name: Download skill package from Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # ⚠️ 精确匹配版本包（勿用 glob：Release 里有历史遗留小包
          # pounding-ozon-probe-darwin-arm64-py312.tar.gz 会排在前面）
          TARGET="pounding-ozon-probe-v${VERSION}.tar.gz"
          echo "Downloading $TARGET"

          # ⚠️ 竞态防护：tag push 时 cd.yml 先创建并发布 Release，而 build-skill 的
          # 4 平台编译要 20-30 分钟才把 skill 包上传到该 Release —— distribute 可能
          # 在包就位前触发导致"该发没发"。轮询等待：每 60s 查一次 Release assets，
          # 最多 40 次（~40 分钟），超时才失败（可 workflow_dispatch 手动重试）。
          # COS 只随 release 发布触发（发布模式已确认：保持自动，现状合规）。
          ASSET_URL=""
          for i in $(seq 1 40); do
            ASSET_URL=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
              --jq ".assets[] | select(.name == \"$TARGET\") | .url" 2>/dev/null | head -1)
            if [ -n "$ASSET_URL" ]; then
              echo "✅ skill 包已就位（第 ${i} 次查询，等待 $(( (i-1) * 60 ))s）"
              break
            fi
            echo "⏳ skill 包未就位（build-skill 4 平台编译中），60s 后重查（$i/40）..."
            sleep 60
          done
          if [ -z "$ASSET_URL" ]; then
            echo "::error::等待 40 分钟 skill 包仍未上传到 Release，请检查 build-skill 是否失败，或 workflow_dispatch 手动重试"
            exit 1
          fi

          gh api --header "Accept: application/octet-stream" "$ASSET_URL" > "dist/$TARGET"
          ls -lh dist/
          test -f "dist/$TARGET" || {
            echo "::error::版本包 $TARGET 未找到"
            exit 1
          }

      - name: Install coscli
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          chmod 755 coscli
          ./coscli --version

      - name: Compute sha256 and generate manifest
        id: manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="pounding-ozon-probe-v${VERSION}.tar.gz"
          SHA=$(sha256sum "dist/$PKG" | awk '{print $1}')
          # manifest url 用 COS_MANIFEST_BASE_URL（公网域名，不带 bucket）
          cat > manifest.json <<EOF
          {"version": "$VERSION", "url": "${COS_MANIFEST_BASE_URL}/pounding-ozon-probe-v${VERSION}.tar.gz", "sha256": "$SHA", "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "notes": "自动更新发布（GitHub Actions v${VERSION}）"}
          EOF
          echo "SHA256: $SHA"
          echo "PKG=$PKG"
          cat manifest.json
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"
        env:
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}

      - name: Upload to Tencent COS
        timeout-minutes: 15   # 跨境上传可能偶发慢，超时让 workflow_dispatch 可重试
        run: |
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.${COS_REGION}.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }
          PKG="${{ steps.manifest.outputs.package_name }}"
          # 1. 安装包
          coscli_cmd cp "dist/${PKG}" "cos://${COS_BUCKET}/ozon-skill/${PKG}"
          # 2. manifest（coscli cp 默认覆盖已有文件，无需 -f——-f 是 coscmd 参数）
          coscli_cmd cp "manifest.json" "cos://${COS_BUCKET}/ozon-skill/manifest.json"
          echo "✅ 已上传: /ozon-skill/${PKG} + /ozon-skill/manifest.json"
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}

      - name: Verify public endpoints
        run: |
          BASE="${COS_MANIFEST_BASE_URL:-https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/ozon-skill}"
          PKG="${{ steps.manifest.outputs.package_name }}"
          for URL in "${BASE}/manifest.json" "${BASE}/${PKG}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "GET $URL → HTTP $CODE"
            test "$CODE" = "200" || { echo "::error::Public endpoint not reachable"; exit 1; }
          done
          echo "✅ COS 公网端点验证通过"
        env:
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
