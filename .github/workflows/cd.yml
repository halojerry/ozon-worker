name: CD — Deploy

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v0.11.1, etc.

permissions:
  contents: write
  packages: write
  actions: read  # v0.75 加固第二批（H12）：CI 闸需读 actions runs

jobs:
  version-check:
    name: Version Four-Source Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assert version sources match tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG} version=${VERSION}"
          for f in VERSION skill/VERSION deploy/skill/VERSION; do
            if [ ! -f "$f" ]; then
              echo "❌ $f 缺失"; exit 1
            fi
            if [ "$(cat "$f")" != "$VERSION" ]; then
              echo "❌ $f = $(cat "$f") != $VERSION"; exit 1
            fi
          done
          if ! grep -qE "^version: \"?$VERSION\"?" skill/SKILL.md; then
            echo "❌ skill/SKILL.md frontmatter != $VERSION"; exit 1
          fi
          echo "✅ 版本四源一致: $VERSION"

      # v0.75 加固第二批（H12）：tag 直接触发部署链，此前「CI 绿才打 tag」纯靠纪律
      # （docs/audit/2026-09-11-io-avalanche.md）。闸=tag 指向的 commit 必须有一趟
      # conclusion=success 的 CI run（CI 在 push main/dev 触发；刚合并即打 tag 会
      # 轮询等待）。逃生门：CD_SKIP_CI_GATE=1（docs-only 提交会被 CI paths-ignore
      # 跳过、确实无 CI run 的场景）。
      - name: "Gate: tagged commit must have green CI"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 逃生门接线 repo variable（Settings → Secrets and variables → Actions →
          # Variables → CD_SKIP_CI_GATE=1）——tag push 无法注入 env，读 vars 才真正
          # 可操作（发版前终审 review Important#1 修复）。
          CD_SKIP_CI_GATE: ${{ vars.CD_SKIP_CI_GATE || '0' }}
        run: |
          if [ "${CD_SKIP_CI_GATE:-0}" = "1" ]; then
            echo "↩️ CD_SKIP_CI_GATE=1，显式跳过 CI 闸"; exit 0
          fi
          SHA="${GITHUB_SHA}"
          for i in $(seq 1 30); do
            RESULT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | select(.name=="CI")] | sort_by(.run_number) | last | if . == null then "none" else "\(.status) \(.conclusion)" end' \
              2>/dev/null || echo "api-failed")
            echo "(${i}/30) tagged commit CI run: ${RESULT}"
            case "$RESULT" in
              "completed success") echo "✅ tagged commit CI 绿"; exit 0 ;;
              completed\ *)       echo "::error::tagged commit 的 CI 结论: ${RESULT}（未通过）——先修 CI 再打 tag"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::15 分钟内未等到 ${SHA:0:8} 的 CI 完成或该提交无 CI run（push 到 main/dev 才触发；docs-only 会被 paths-ignore 跳过）——确认后重跑本 CD run（gate 会重新求值，无需重打 tag），或设 repo variable CD_SKIP_CI_GATE=1 显式跳过"
          exit 1

  deploy:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # v0.29.1: login → build-push(gha 缓存 — pip/基础镜像层跨发版复用)
      - name: Login to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: worker/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ozon-worker:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ozon-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git log --oneline --no-merges "$PREV_TAG..HEAD" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes=首次发布" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Docker
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/ozon-worker:${{ github.ref_name }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}

  # ═══ COS Deploy Package: 服务器无法访问 GitHub, 部署包走 COS 分发 ═══
  # (PRD-cicd-stability 3.2: 打包源码 tar.gz → COS /ozon-worker/ + manifest)
  cos-deploy:
    name: COS Deploy Package
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Bun (WebUI 前端构建)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build WebUI (webui/dist)
        working-directory: webui
        run: |
          bun install
          bun run build
          test -f dist/index.html && echo "✅ dist/index.html 已生成"

      # T32(cicd-H2): manifest 签名与上一份 manifest 验签都需要 minisign。
      # 静态二进制 sha256 pin 形态同 T30 coscli pin——官方不发校验值, 升级时
      # 人工下载重算并同步本值。留空 = fail-closed(不允许无 pin 下载并执行二进制,
      # 否则下载通道本身成为新信任根)。
      - name: Install minisign (pinned)
        env:
          # ⚠️ 合并前用户必须补算（本任务环境禁出站网络无法预计算）:
          # 下载 $MINISIGN_URL → sha256sum → 填入（见 task-32 报告「合并前用户待办」）
          MINISIGN_SHA256: ""
          # pin 版本源（jedisct1/minisign 官方 release 静态二进制; 换版本须重算 SHA）
          MINISIGN_URL: "https://github.com/jedisct1/minisign/releases/download/v0.11/minisign-0.11-linux-amd64.tar.gz"
        run: |
          if [ -z "$MINISIGN_SHA256" ]; then
            echo "::error::MINISIGN_SHA256 未填——合并前须人工下载 pin 版 minisign 并补算 sha256（下载 $MINISIGN_URL → sha256sum → 填入本文件）"
            exit 1
          fi
          curl -L --fail --retry 3 --retry-delay 2 -o minisign.tar.gz "$MINISIGN_URL"
          [ -s minisign.tar.gz ] || { echo "::error::minisign 下载为空"; exit 1; }
          echo "${MINISIGN_SHA256}  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz
          BIN="$(find . -type f -name minisign | head -1)"
          [ -n "$BIN" ] || { echo "::error::minisign 压缩包内未找到二进制(检查 MINISIGN_URL 产物布局)"; exit 1; }
          mv "$BIN" ./minisign
          chmod 755 ./minisign
          ./minisign -v 2>&1 | head -1 || true
          echo "✅ minisign 就位"

      - name: Package deploy tarball (deploy/ + worker/ 源码 + webui/dist 前端, 服务器自行 build)
        run: |
          VERSION="${CD_VERSION}"
          mkdir -p pkg
          tar -czf "pkg/ozon-worker-deploy-${VERSION}.tar.gz" \
            --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='worker/.venv*' --exclude='worker/src/**/__pycache__' \
            --exclude='deploy/.env' --exclude='deploy/skill' \
            --exclude='deploy/*.tar.gz' \
            --exclude='webui/node_modules' --exclude='webui/dist/assets/*.map' \
            deploy worker webui docs
          SHA=$(sha256sum "pkg/ozon-worker-deploy-${VERSION}.tar.gz" | awk '{print $1}')
          echo "SHA256: $SHA"
          # T32(cicd-H2): 上一份 manifest 只有验签通过才可信——否则能写 bucket 的
          # 攻击者可伪造 versions 版本表/cache_sha256, 借本次合法签名「洗白」。
          # 无上一份(首发)或验签不过 → 版本表/缓存表从空开始(旧回滚路径随之失效,
          # 换来的是回滚包同样强制过签名哈希)。公钥未入库时同样从空开始(用户待办)。
          PREV_OK=0
          if [ -f deploy/cos-update.pub ]; then
            curl -fsSL --max-time 30 -o pkg/manifest.prev.json "${MANIFEST_URL}" || true
            curl -fsSL --max-time 30 -o pkg/manifest.prev.json.sig "${MANIFEST_URL}.sig" || true
            if [ -s pkg/manifest.prev.json ] && [ -s pkg/manifest.prev.json.sig ]; then
              if ./minisign -V -q -p deploy/cos-update.pub -x pkg/manifest.prev.json.sig -m pkg/manifest.prev.json; then
                PREV_OK=1
                echo "✅ 上一份 manifest 验签通过, 继承版本表/cache_sha256"
              else
                echo "⚠️ 上一份 manifest 验签失败——版本表从空开始(不继承不可信历史)"
              fi
            else
              echo "ℹ️ COS 无上一份 manifest/签名(首发)——版本表从空开始"
            fi
          else
            echo "⚠️ deploy/cos-update.pub 不在仓库(用户合并前待办未完成)——版本表从空开始"
          fi
          # manifest 生成改 python3: 新增 versions 版本表(最近 10 版——cos-update.sh
          # 指定版本回滚从表里取签名过的 sha256, 封死「指定版本跳过校验」)与
          # cache_sha256(缓存 JSON 哈希表)。⚠️ 带外重传缓存 JSON(CACHE-WARM-RUNBOOK)
          # 后须按 runbook 同步重签 manifest——否则升级时缓存校验不过会跳过(懒加载兜底)。
          CD_VERSION="$VERSION" PKG_SHA256="$SHA" PREV_OK="$PREV_OK" \
          python3 - <<'PYEOF'
          import datetime
          import json
          import os

          version = os.environ["CD_VERSION"]
          pkg = f"ozon-worker-deploy-{version}.tar.gz"
          manifest = {
              "version": version,
              "package": pkg,
              "sha256": os.environ["PKG_SHA256"],
              "url": f"https://{os.environ['COS_BUCKET']}.cos.{os.environ['COS_REGION']}.myqcloud.com/ozon-worker/{pkg}",
              "released_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          versions = {}
          cache_sha256 = {}
          if os.environ.get("PREV_OK") == "1":
              with open("pkg/manifest.prev.json", encoding="utf-8") as f:
                  prev = json.load(f)
              versions = prev.get("versions") or {}
              cache_sha256 = prev.get("cache_sha256") or {}

          def _vkey(tag):
              try:
                  return [int(p) for p in str(tag).lstrip("v").split(".")]
              except ValueError:
                  return [0]

          versions[version] = {"package": pkg, "sha256": manifest["sha256"],
                               "released_at": manifest["released_at"]}
          manifest["versions"] = {k: versions[k] for k in sorted(versions, key=_vkey)[-10:]}
          manifest["cache_sha256"] = cache_sha256
          # 单行紧凑 JSON——与旧 heredoc 格式一致; cos-update.sh 的版本表提取是
          # 行式 grep, 服务端还会压平兜底, 但源头保持单行最稳。
          with open("pkg/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PYEOF
          python3 -c 'import json; json.load(open("pkg/manifest.json"))' \
            || { echo "::error::manifest.json 生成失败(JSON 不合法)"; exit 1; }
          cat pkg/manifest.json
          ls -la pkg/
        env:
          # T23(cicd-M3): 表达式只在 env 展开一次，不进 shell 二次插值——tag 名
          # （git refname 允许 ; " $( 等）不可被注入 runner shell。
          CD_VERSION: ${{ steps.version.outputs.version }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          MANIFEST_URL: https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/ozon-worker/manifest.json

      - name: Sign manifest (minisign, T32 cicd-H2 信任根收口)
        env:
          # 私钥文件原文（minisign -G 产出、无密码保护——CI 无法交互输密码）进
          # repo secret COS_UPDATE_SIGN_KEY, 由用户一次性人工配置 + 离线冷备。
          COS_UPDATE_SIGN_KEY: ${{ secrets.COS_UPDATE_SIGN_KEY }}
        run: |
          [ -f ./minisign ] || { echo "::error::minisign 未就位(前序 Install minisign 步骤应已失败)"; exit 1; }
          [ -f deploy/cos-update.pub ] || { echo "::error::deploy/cos-update.pub 不在仓库——用户合并前待办未完成(minisign -G 公钥入库)"; exit 1; }
          if [ -z "$COS_UPDATE_SIGN_KEY" ]; then
            echo "::error::repo secret COS_UPDATE_SIGN_KEY 未配置——先 minisign -G 生成 keypair: 私钥内容(密码留空)进该 secret + 离线冷备, 公钥提交 deploy/cos-update.pub"
            exit 1
          fi
          # 私钥从 secret 落临时文件(minisign 需要文件路径), 签名后立即删除
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$COS_UPDATE_SIGN_KEY" > "$KEY_FILE"
          ./minisign -S -s "$KEY_FILE" -x pkg/manifest.sig -m pkg/manifest.json
          rm -f "$KEY_FILE"
          # 自检: 用仓库内公钥(信任根本体)回验——密钥/签名/工具任一不对当场炸在 CI
          # (verify_manifest.sh 走 PATH 上的 minisign, 把 workspace 根加进 PATH)
          export PATH="$PWD:$PATH"
          bash deploy/verify_manifest.sh deploy/cos-update.pub pkg/manifest.json pkg/manifest.sig \
            || { echo "::error::manifest 签名自检失败(verify_manifest.sh exit $?)"; exit 1; }
          echo "✅ manifest.json 已签名 + 公钥回验通过"

      - name: Install coscli
        env:
          # T30(cicd-M4): coscli 二进制 sha256 pin（2026-09-16 人工一次性下载
          # coscli-linux-amd64 算得，14,212,085 bytes）。官方不发布校验值，升级
          # coscli 时必须重新下载重算并同步本值（同值用于 build-skill.yml /
          # skill-distribute.yml，三处须一致）。
          COSCLI_SHA256: "a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915"
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          [ -s coscli ] || { echo "::error::coscli 下载为空"; exit 1; }
          echo "${COSCLI_SHA256}  coscli" | sha256sum -c -
          chmod 755 coscli
          ./coscli --version

      - name: Upload to Tencent COS (/ozon-worker/)
        timeout-minutes: 60
        run: |
          VERSION="${CD_VERSION}"
          PKG="ozon-worker-deploy-${VERSION}.tar.gz"
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.accelerate.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }
          UPLOADED=0
          for attempt in 1 2 3; do
            echo "⏳ COS 上传尝试 $attempt/3: ${PKG} + manifest.json + manifest.sig"
            if coscli_cmd cp "pkg/${PKG}" "cos://${COS_BUCKET}/ozon-worker/${PKG}" \
               && coscli_cmd cp "pkg/manifest.json" "cos://${COS_BUCKET}/ozon-worker/manifest.json" \
               && coscli_cmd cp "pkg/manifest.sig" "cos://${COS_BUCKET}/ozon-worker/manifest.sig"; then
              UPLOADED=1
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          if [ "$UPLOADED" -ne 1 ]; then
            echo "::error::COS 上传 3 次均失败"
            exit 1
          fi
          echo "✅ 已上传: /ozon-worker/${PKG} + /ozon-worker/manifest.json + /ozon-worker/manifest.sig"
        env:
          # T23(cicd-M3): 表达式只在 env 展开一次，不进 shell 二次插值——tag 名
          # （git refname 允许 ; " $( 等）不可被注入 runner shell。
          CD_VERSION: ${{ steps.version.outputs.version }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
