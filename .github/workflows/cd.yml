name: CD — Deploy

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v0.11.1, etc.

permissions:
  contents: write
  packages: write
  actions: read  # v0.75 加固第二批（H12）：CI 闸需读 actions runs

jobs:
  version-check:
    name: Version Four-Source Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assert version sources match tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG} version=${VERSION}"
          for f in VERSION skill/VERSION deploy/skill/VERSION; do
            if [ ! -f "$f" ]; then
              echo "❌ $f 缺失"; exit 1
            fi
            if [ "$(cat "$f")" != "$VERSION" ]; then
              echo "❌ $f = $(cat "$f") != $VERSION"; exit 1
            fi
          done
          if ! grep -qE "^version: \"?$VERSION\"?" skill/SKILL.md; then
            echo "❌ skill/SKILL.md frontmatter != $VERSION"; exit 1
          fi
          echo "✅ 版本四源一致: $VERSION"

      # v0.75 加固第二批（H12）：tag 直接触发部署链，此前「CI 绿才打 tag」纯靠纪律
      # （docs/audit/2026-09-11-io-avalanche.md）。闸=tag 指向的 commit 必须有一趟
      # conclusion=success 的 CI run（CI 在 push main/dev 触发；刚合并即打 tag 会
      # 轮询等待）。逃生门：CD_SKIP_CI_GATE=1（docs-only 提交会被 CI paths-ignore
      # 跳过、确实无 CI run 的场景）。
      - name: "Gate: tagged commit must have green CI"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 逃生门接线 repo variable（Settings → Secrets and variables → Actions →
          # Variables → CD_SKIP_CI_GATE=1）——tag push 无法注入 env，读 vars 才真正
          # 可操作（发版前终审 review Important#1 修复）。
          CD_SKIP_CI_GATE: ${{ vars.CD_SKIP_CI_GATE || '0' }}
        run: |
          if [ "${CD_SKIP_CI_GATE:-0}" = "1" ]; then
            echo "↩️ CD_SKIP_CI_GATE=1，显式跳过 CI 闸"; exit 0
          fi
          SHA="${GITHUB_SHA}"
          for i in $(seq 1 30); do
            RESULT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | select(.name=="CI")] | sort_by(.run_number) | last | if . == null then "none" else "\(.status) \(.conclusion)" end' \
              2>/dev/null || echo "api-failed")
            echo "(${i}/30) tagged commit CI run: ${RESULT}"
            case "$RESULT" in
              "completed success") echo "✅ tagged commit CI 绿"; exit 0 ;;
              completed\ *)       echo "::error::tagged commit 的 CI 结论: ${RESULT}（未通过）——先修 CI 再打 tag"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::15 分钟内未等到 ${SHA:0:8} 的 CI 完成或该提交无 CI run（push 到 main/dev 才触发；docs-only 会被 paths-ignore 跳过）——确认后重跑本 CD run（gate 会重新求值，无需重打 tag），或设 repo variable CD_SKIP_CI_GATE=1 显式跳过"
          exit 1

  deploy:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # v0.29.1: login → build-push(gha 缓存 — pip/基础镜像层跨发版复用)
      - name: Login to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: worker/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ozon-worker:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ozon-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git log --oneline --no-merges "$PREV_TAG..HEAD" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes=首次发布" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Docker
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/ozon-worker:${{ github.ref_name }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}

  # ═══ COS Deploy Package: 服务器无法访问 GitHub, 部署包走 COS 分发 ═══
  # (PRD-cicd-stability 3.2: 打包源码 tar.gz → COS /ozon-worker/ + manifest)
  cos-deploy:
    name: COS Deploy Package
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Bun (WebUI 前端构建)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build WebUI (webui/dist)
        working-directory: webui
        run: |
          bun install
          bun run build
          test -f dist/index.html && echo "✅ dist/index.html 已生成"

      - name: Package deploy tarball (deploy/ + worker/ 源码 + webui/dist 前端, 服务器自行 build)
        run: |
          VERSION="${CD_VERSION}"
          mkdir -p pkg
          tar -czf "pkg/ozon-worker-deploy-${VERSION}.tar.gz" \
            --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='worker/.venv*' --exclude='worker/src/**/__pycache__' \
            --exclude='deploy/.env' --exclude='deploy/skill' \
            --exclude='deploy/*.tar.gz' \
            --exclude='webui/node_modules' --exclude='webui/dist/assets/*.map' \
            deploy worker webui docs
          SHA=$(sha256sum "pkg/ozon-worker-deploy-${VERSION}.tar.gz" | awk '{print $1}')
          cat > pkg/manifest.json <<EOF
          {"version": "$VERSION", "package": "ozon-worker-deploy-${VERSION}.tar.gz", "sha256": "$SHA", "url": "https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/ozon-worker/ozon-worker-deploy-${VERSION}.tar.gz", "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          echo "SHA256: $SHA"
          ls -la pkg/
        env:
          # T23(cicd-M3): 表达式只在 env 展开一次，不进 shell 二次插值——tag 名
          # （git refname 允许 ; " $( 等）不可被注入 runner shell。
          CD_VERSION: ${{ steps.version.outputs.version }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}

      - name: Install coscli
        env:
          # T30(cicd-M4): coscli 二进制 sha256 pin（2026-09-16 人工一次性下载
          # coscli-linux-amd64 算得，14,212,085 bytes）。官方不发布校验值，升级
          # coscli 时必须重新下载重算并同步本值（同值用于 build-skill.yml /
          # skill-distribute.yml，三处须一致）。
          COSCLI_SHA256: "a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915"
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          [ -s coscli ] || { echo "::error::coscli 下载为空"; exit 1; }
          echo "${COSCLI_SHA256}  coscli" | sha256sum -c -
          chmod 755 coscli
          ./coscli --version

      - name: Upload to Tencent COS (/ozon-worker/)
        timeout-minutes: 60
        run: |
          VERSION="${CD_VERSION}"
          PKG="ozon-worker-deploy-${VERSION}.tar.gz"
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.accelerate.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }
          UPLOADED=0
          for attempt in 1 2 3; do
            echo "⏳ COS 上传尝试 $attempt/3: ${PKG}"
            if coscli_cmd cp "pkg/${PKG}" "cos://${COS_BUCKET}/ozon-worker/${PKG}" \
               && coscli_cmd cp "pkg/manifest.json" "cos://${COS_BUCKET}/ozon-worker/manifest.json"; then
              UPLOADED=1
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          if [ "$UPLOADED" -ne 1 ]; then
            echo "::error::COS 上传 3 次均失败"
            exit 1
          fi
          echo "✅ 已上传: /ozon-worker/${PKG} + /ozon-worker/manifest.json"
        env:
          # T23(cicd-M3): 表达式只在 env 展开一次，不进 shell 二次插值——tag 名
          # （git refname 允许 ; " $( 等）不可被注入 runner shell。
          CD_VERSION: ${{ steps.version.outputs.version }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
