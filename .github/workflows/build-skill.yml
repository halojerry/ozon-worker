name: Build Skill Binary Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            python-architecture: arm64
          - os: macos-latest
            platform: darwin-x86_64
            python-architecture: x64
          - os: ubuntu-latest
            platform: linux
            python-architecture: x64
          - os: windows-latest
            platform: win32
            python-architecture: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}

      - name: Install dependencies
        run: pip install cython setuptools && pip install -r skill/requirements.txt

      - name: Compile
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: skill/dist/scripts/lib/_native/
          retention-days: 1

  package:
    name: Package unified binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cython setuptools

      - name: Build base dist
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _platforms/
          merge-multiple: false

      - name: Merge binaries into _native
        working-directory: skill/dist/scripts/lib/_native
        run: |
          echo "=== Before merge ==="
          find . -type f | sort
          echo ""

          # Copy each platform's binaries
          for platform_dir in ../../../_platforms/native-*/; do
            platform_name=$(basename "$platform_dir" | sed 's/native-//')
            echo "Merging platform: $platform_name"
            mkdir -p "$platform_name"
            # The artifact contains the _native/ contents, so files are directly in the dir
            cp -r "$platform_dir"/* "$platform_name/" 2>/dev/null || \
            cp -r "$platform_dir"/scripts/lib/_native/* "$platform_name/" 2>/dev/null || \
            echo "  (no files found for $platform_name)"
          done

          echo ""
          echo "=== After merge ==="
          find . -type f | sort

      - name: Clean and create package
        working-directory: skill/dist
        run: |
          rm -f data/config/stores.json data/config/settings.json
          find . -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Create distributable package
        working-directory: skill
        run: |
          VERSION=$(cat ../VERSION 2>/dev/null || echo "0.4.0")
          tar czf "pounding-ozon-probe-v${VERSION}.tar.gz" -C dist .
          ls -lh "pounding-ozon-probe-v${VERSION}.tar.gz"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pounding-ozon-probe
          path: skill/pounding-ozon-probe-*.tar.gz
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: skill/pounding-ozon-probe-*.tar.gz
          generate_release_notes: true
