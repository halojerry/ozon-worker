name: Build Skill Binary Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'skill/**'
    branches: [main]

jobs:
  build-macos:
    name: Build macOS (${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install cython setuptools
          pip install -r skill/requirements.txt

      - name: Compile Cython modules
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-darwin-py${{ matrix.python-version }}
          path: skill/dist/scripts/lib/_native/darwin/
          retention-days: 7

  build-windows:
    name: Build Windows (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install cython setuptools
          pip install -r skill/requirements.txt

      - name: Compile Cython modules
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-win32-py${{ matrix.python-version }}
          path: skill/dist/scripts/lib/_native/win32/
          retention-days: 7

  package:
    name: Package unified binary
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cython setuptools

      - name: Build base dist (without native modules)
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      # Download all platform/version artifacts
      - name: Download macOS 3.12 artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-darwin-py3.12
          path: skill/dist/scripts/lib/_native/darwin312/

      - name: Download macOS 3.13 artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-darwin-py3.13
          path: skill/dist/scripts/lib/_native/darwin313/

      - name: Download Windows 3.12 artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-win32-py3.12
          path: skill/dist/scripts/lib/_native/win32_312/

      - name: Download Windows 3.13 artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-win32-py3.13
          path: skill/dist/scripts/lib/_native/win32_313/

      - name: Merge into unified _native structure
        working-directory: skill/dist/scripts/lib/_native
        run: |
          # macOS: merge 3.12 and 3.13 into darwin/
          mkdir -p darwin
          cp darwin312/* darwin/ 2>/dev/null || true
          cp darwin313/* darwin/ 2>/dev/null || true
          # Windows: merge 3.12 and 3.13 into win32/
          mkdir -p win32
          cp win32_312/* win32/ 2>/dev/null || true
          cp win32_313/* win32/ 2>/dev/null || true
          # Linux: use ubuntu runner's 3.12 build
          cp darwin312/*.so ../_native/linux/ 2>/dev/null || true
          # Cleanup temp dirs
          rm -rf darwin312 darwin313 win32_312 win32_313
          echo "=== Final _native structure ==="
          find . -type f | sort

      - name: Clean test data
        working-directory: skill/dist
        run: |
          rm -f data/config/stores.json data/config/settings.json
          find . -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Create distributable package
        working-directory: skill
        run: |
          VERSION=$(cat ../VERSION 2>/dev/null || echo "0.3.0")
          tar czf "pounding-ozon-probe-v${VERSION}.tar.gz" -C dist .
          ls -lh "pounding-ozon-probe-v${VERSION}.tar.gz"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: pounding-ozon-probe
          path: skill/pounding-ozon-probe-*.tar.gz
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: skill/pounding-ozon-probe-*.tar.gz
          generate_release_notes: true
