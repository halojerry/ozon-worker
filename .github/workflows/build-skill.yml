name: Build Skill Binary Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            python-architecture: arm64
          - os: macos-latest
            platform: darwin-x86_64
            python-architecture: x64
            archflags: "-arch x86_64"
          - os: ubuntu-latest
            platform: linux
            python-architecture: x64
          - os: windows-latest
            platform: win32
            python-architecture: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}

      - name: Install dependencies
        run: pip install cython setuptools && pip install -r skill/requirements.txt

      - name: Compile
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Recompile with ARCHFLAGS for x86_64
        if: matrix.archflags != ''
        working-directory: skill
        run: |
          export ARCHFLAGS="${{ matrix.archflags }}"
          python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Fix platform dir for Rosetta 2
        if: matrix.platform == 'darwin-x86_64'
        working-directory: skill/dist/scripts/lib/_native
        run: |
          if [ -d darwin-arm64 ] && [ ! -d darwin-x86_64 ]; then
            mv darwin-arm64 darwin-x86_64
            echo "✅ Renamed darwin-arm64 → darwin-x86_64"
          fi

      # ⚠️ 编译产物 3.12 冒烟导入：静态 ls 完整性校验（package job）无法发现
      # 「.so/.pyd 存在但 import 即崩」的运行时问题（如 ABI 不匹配/缺符号）。
      # 每平台编译后立即用 Python 3.12 实际 import 8 个编译模块，任一失败 → exit 1。
      # 本地 Docker 预验证（python:3.12-slim + gcc，无 display/网络）：8 模块全部导入成功。
      # 注意 shell: bash —— win32 默认 pwsh 不支持 heredoc。
      - name: Smoke import compiled binaries (3.12)
        shell: bash
        working-directory: skill/dist
        run: |
          set -e
          PYTHONPATH=. python - <<'EOF'
          import importlib, sys
          mods = ["ak_1688_client", "ak_callback", "config_store",
                  "image_preprocessor", "ozon_scraper", "ozon_image_search",
                  "reference_images", "ozon_api"]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(f"scripts.lib.{m}")
                  print(f"  OK {m}")
              except Exception as e:
                  failed.append(f"{m}: {type(e).__name__}: {e}")
          if failed:
              print("::error::编译产物导入失败:\n" + "\n".join(failed))
              sys.exit(1)
          print(f"8 个编译模块全部导入成功 (Python {sys.version.split()[0]})")
          EOF

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: skill/dist/scripts/lib/_native/
          retention-days: 1

  package:
    name: Package unified binary
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cython setuptools

      - name: Build base dist
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _platforms/
          merge-multiple: false

      - name: Merge binaries into _native
        working-directory: skill/dist/scripts/lib/_native
        run: |
          echo "=== Before merge ==="
          find . -type f | sort
          echo ""

          # Copy each platform's binaries
          for platform_dir in ../../../../../_platforms/native-*/; do
            platform_name=$(basename "$platform_dir" | sed 's/native-//')
            echo "Merging platform: $platform_name"
            mkdir -p "$platform_name"
            # Artifact 内部结构: {platform_name}/*.so — 进到内层取
            if [ -d "$platform_dir/$platform_name" ]; then
              cp "$platform_dir/$platform_name"/* "$platform_name/"
            else
              cp "$platform_dir"/* "$platform_name/" 2>/dev/null || true
            fi
          done

          echo ""
          echo "=== After merge ==="
          find . -type f | sort

      # ⚠️ 产物完整性校验：每个编译模块在 4 平台目录都须有 .so/.pyd
      # （win32 缺 cloud_probe.pyd 的教训：编译失败被 compile.py 静默吞掉，
      #   Build job 仍 Success 导致残缺包发布）
      - name: Verify native binaries completeness
        working-directory: skill/dist/scripts/lib/_native
        run: |
          MISSING=0
          # v0.28.6: chrome_launcher 移回明文(独立 profile 改造, 不再编译)
          # v0.35.1: ozon_discovery 移回明文(discover 运营指标链路适配任意 ≥3.12 解释器)
          for mod in ak_1688_client ak_callback config_store \
                     image_preprocessor ozon_scraper ozon_image_search \
                     reference_images ozon_api; do
            for plat in darwin-arm64 darwin-x86_64 linux win32; do
              if ! ls "$plat"/"$mod".* 2>/dev/null | grep -qE "\.(so|pyd)$"; then
                echo "❌ 缺失: $mod → $plat"
                MISSING=$((MISSING+1))
              fi
            done
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING 个二进制缺失，构建中止"
            exit 1
          fi
          echo "✅ 4 平台 × 8 模块 = 32 个二进制全部就位"

      - name: Clean and create package
        working-directory: skill/dist
        run: |
          rm -f data/config/stores.json data/config/settings.json
          find . -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

      # ⚠️ P0 修复(2026-08-06): 包内 VERSION 与 manifest 版本分离导致自动更新死循环。
      # 根因: compile.py 复制 skill/VERSION(0.25.0) 进 dist, 而打包名/manifest 用
      # 根 VERSION(0.27.0) → updater 判定 0.27.0 > 0.25.0 每次命令都下载覆盖, 永不收敛。
      # 修复: ① 打包前用发布 tag 强制写包内 VERSION ② 硬校验包内 VERSION == manifest 版本。
      - name: Pin package VERSION to release tag
        working-directory: skill/dist
        run: |
          REF="${GITHUB_REF_NAME#v}"
          printf '%s' "$REF" > VERSION
          echo "✅ 包内 VERSION=$(cat VERSION) (来自 tag $GITHUB_REF_NAME)"

      - name: Create distributable package
        working-directory: skill
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VERSION="$REF"
          tar czf "pounding-ozon-probe-v${VERSION}.tar.gz" -C dist .
          # ⚠️ 硬校验: 包内 VERSION 必须 == manifest 版本, 否则 updater 死循环
          # (`-C dist .` 打包成员名带 ./ 前缀, GNU tar(CI) 精确名 VERSION 匹配不到
          #  ./VERSION → 先列出成员名再提取, 跨 GNU/BSD tar 兼容)
          VFILE=$(tar -tzf "pounding-ozon-probe-v${VERSION}.tar.gz" | grep -E '(^|/)VERSION$' | head -1)
          INNER=$(tar -xOzf "pounding-ozon-probe-v${VERSION}.tar.gz" "$VFILE")
          if [ "$INNER" != "$VERSION" ]; then
            echo "::error::包内 VERSION($INNER) != 发布版本($VERSION), 自动更新将死循环"
            exit 1
          fi
          echo "✅ 硬校验通过: 包内 VERSION=$INNER == 发布版本 $VERSION (成员: $VFILE)"
          ls -lh "pounding-ozon-probe-v${VERSION}.tar.gz"

      - name: Compute sha256 and generate manifest
        id: manifest
        working-directory: skill
        run: |
          REF="${GITHUB_REF_NAME#v}"
          VERSION="$REF"
          # ⚠️ 精确匹配版本包名（勿用 *.tar.gz：目录里有历史遗留旧包
          # 如 pounding-ozon-probe-darwin-arm64-py312.tar.gz，字母序排在
          # v 之前会被误选）
          PKG="pounding-ozon-probe-v${VERSION}.tar.gz"
          SHA=$(sha256sum "$PKG" | awk '{print $1}')
          cat > manifest.json <<EOF
          {"version": "$VERSION", "url": "${COS_MANIFEST_BASE_URL}/pounding-ozon-probe-v${VERSION}.tar.gz", "sha256": "$SHA", "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "notes": "自动更新发布（GitHub Actions v${VERSION}）"}
          EOF
          echo "PKG=$PKG"
          echo "SHA256: $SHA"
          cat manifest.json
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
        env:
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}

      # ⚠️ 分发直传 COS（v0.18.0 起）：不再依赖 skill-distribute 轮询
      # Release 资产（实测该链路 4 次全失败 + release 事件零运行记录）。
      # 包产出后同一 job 直接上传，带 3 次重试；失败即整体构建失败，
      # 不会出现"Release 有包但 COS 断供"的静默状态。
      - name: Install coscli
        working-directory: skill
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          chmod 755 coscli
          ./coscli --version

      - name: Upload package and manifest to COS
        timeout-minutes: 60
        working-directory: skill
        run: |
          PKG="${{ steps.manifest.outputs.package_name }}"
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.${COS_REGION}.myqcloud.com" \
              -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" \
              --init-skip=true --disable-log=true
          }
          # ⚠️ v0.19.2: coscli 无请求超时，跨境上传 TCP 黑洞会无限挂死
          # （v0.19.1 实测挂 8 小时）。用 GNU timeout 给每次尝试限 600s；
          # timeout 不能直接执行 shell 函数，需 bash -c 内联。
          UPLOADED=0
          for attempt in 1 2 3; do
            echo "⏳ COS 上传尝试 $attempt/3: ${PKG} + manifest.json"
            # ⚠️ v0.20.0: COS 全球加速域名（cos.accelerate.myqcloud.com）——
            # 跨境上传直连广州节点极慢（实测挂 8 小时），加速域名显著提速。
            if timeout 600 bash -c 'c(){ ./coscli "$@" -e "cos.accelerate.myqcloud.com" -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" --init-skip=true --disable-log=true; }; c cp "$1" "cos://${COS_BUCKET}/ozon-skill/$1"' _ "${PKG}" \
               && timeout 600 bash -c 'c(){ ./coscli "$@" -e "cos.accelerate.myqcloud.com" -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" --init-skip=true --disable-log=true; }; c cp "$1" "cos://${COS_BUCKET}/ozon-skill/$1"' _ "manifest.json"; then
              UPLOADED=1
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          if [ "$UPLOADED" -ne 1 ]; then
            echo "::error::COS 上传 3 次均失败"
            exit 1
          fi
          echo "✅ 已上传: cos://${COS_BUCKET}/ozon-skill/${PKG} + manifest.json"
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}

      # ⚠️ 旧包清理(2026-08-06): 上传只 cp 不删, 旧版本(含死循环坏包如 0.27.0)
      # 永久残留 bucket, 手动用旧 URL 可下载到。每次发布后保留最新 2 个包
      # (当前 + 上一个), 其余删除——updater 只读 manifest(指向当前), 删旧包安全。
      - name: Prune old skill packages from COS
        timeout-minutes: 10
        working-directory: skill
        run: |
          coscli_cmd() {
            ./coscli "$@" -e "cos.accelerate.myqcloud.com" \
              -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" \
              --init-skip=true --disable-log=true
          }
          # 调试: 打印 ls 原始输出(前 15 行), 便于定位格式不匹配
          echo "--- coscli ls 原始输出(前15行) ---"
          coscli_cmd ls "cos://${COS_BUCKET}/ozon-skill/" 2>&1 | head -15
          # ⚠️ v0.28.1: coscli ls 输出格式与精确 grep 不匹配导致 COUNT=0 静默不删。
          # 改用宽松匹配(容忍路径前缀/列分隔/宽度填充), 并打印提取结果。
          RAW=$(coscli_cmd ls "cos://${COS_BUCKET}/ozon-skill/" 2>&1)
          PKGS=$(echo "$RAW" \
            | grep -oE '[^ |]*pounding-ozon-probe-v[0-9][^ |]*\.tar\.gz' \
            | sed -E 's#.*/##' | sort -V)
          COUNT=$(echo "$PKGS" | grep -c . || true)
          echo "提取到版本包 $COUNT 个: $(echo "$PKGS" | tr '\n' ' ')"
          if [ "$COUNT" -gt 2 ]; then
            # ⚠️ v0.28.2: coscli rm 会从 stdin 读数据, 吞掉 while 管道剩余行
            # (实证: 9 行只删了 5 个隔行的 0.12/0.18/0.20/0.25/0.27.2)。
            # 修复: awk 结果先落临时文件, 循环读文件; rm 加 </dev/null 防吞输入。
            echo "$PKGS" | awk -v t="$COUNT" 'NR <= t-2' > /tmp/prune_list.txt
            while IFS= read -r old; do
              echo "🗑️ 删除旧包: $old"
              coscli_cmd rm "cos://${COS_BUCKET}/ozon-skill/$old" </dev/null \
                || echo "⚠️ 删除 $old 失败(忽略, 下次发布再试)"
            done < /tmp/prune_list.txt
            rm -f /tmp/prune_list.txt
          else
            echo "无需清理(保留最近 2 个)"
          fi
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}

      # ⚠️ 分发一致性校验：COS 包 sha256 必须与本地包一致、公网必须可访问。
      # （旧链路只校验 Release 资产，COS 上传超时/断供无人发现——掩耳盗铃）
      - name: Verify COS endpoints and sha256
        timeout-minutes: 10
        working-directory: skill
        run: |
          PKG="${{ steps.manifest.outputs.package_name }}"
          BASE="${COS_MANIFEST_BASE_URL:-https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/ozon-skill}"
          for URL in "${BASE}/manifest.json" "${BASE}/${PKG}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "GET $URL → HTTP $CODE"
            test "$CODE" = "200" || { echo "::error::COS 公网端点不可访问"; exit 1; }
          done
          LOCAL_SHA=$(sha256sum "$PKG" | awk '{print $1}')
          REMOTE_SHA=$(curl -s -L "${BASE}/${PKG}" | sha256sum | awk '{print $1}')
          echo "local=${LOCAL_SHA}"
          echo "remote=${REMOTE_SHA}"
          test "$LOCAL_SHA" = "$REMOTE_SHA" || {
            echo "::error::COS 包 sha256 与本地不一致（上传损坏）"; exit 1; }
          echo "✅ COS 分发完成: ${PKG}（sha256 一致）"
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pounding-ozon-probe
          # ⚠️ 只上传版本包：仓库根有历史遗留旧包（pounding-ozon-probe-
          # darwin-arm64-py312.tar.gz 等）会被 glob 匹配混入 Release
          path: skill/pounding-ozon-probe-v*.tar.gz
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 精确匹配版本包，勿用 *.tar.gz（会带上历史遗留残缺旧包）
          files: skill/pounding-ozon-probe-v*.tar.gz
          generate_release_notes: true
