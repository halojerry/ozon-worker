name: Build Skill Binary Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            python-architecture: arm64
          - os: macos-latest
            platform: darwin-x86_64
            python-architecture: x64
            archflags: "-arch x86_64"
          - os: ubuntu-latest
            platform: linux
            python-architecture: x64
          - os: windows-latest
            platform: win32
            python-architecture: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}

      - name: Install dependencies
        run: pip install cython setuptools && pip install -r skill/requirements.txt

      - name: Compile
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Recompile with ARCHFLAGS for x86_64
        if: matrix.archflags != ''
        working-directory: skill
        run: |
          export ARCHFLAGS="${{ matrix.archflags }}"
          python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Fix platform dir for Rosetta 2
        if: matrix.platform == 'darwin-x86_64'
        working-directory: skill/dist/scripts/lib/_native
        run: |
          if [ -d darwin-arm64 ] && [ ! -d darwin-x86_64 ]; then
            mv darwin-arm64 darwin-x86_64
            echo "✅ Renamed darwin-arm64 → darwin-x86_64"
          fi

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: skill/dist/scripts/lib/_native/
          retention-days: 1

  package:
    name: Package unified binary
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cython setuptools

      - name: Build base dist
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _platforms/
          merge-multiple: false

      - name: Merge binaries into _native
        working-directory: skill/dist/scripts/lib/_native
        run: |
          echo "=== Before merge ==="
          find . -type f | sort
          echo ""

          # Copy each platform's binaries
          for platform_dir in ../../../../../_platforms/native-*/; do
            platform_name=$(basename "$platform_dir" | sed 's/native-//')
            echo "Merging platform: $platform_name"
            mkdir -p "$platform_name"
            # Artifact 内部结构: {platform_name}/*.so — 进到内层取
            if [ -d "$platform_dir/$platform_name" ]; then
              cp "$platform_dir/$platform_name"/* "$platform_name/"
            else
              cp "$platform_dir"/* "$platform_name/" 2>/dev/null || true
            fi
          done

          echo ""
          echo "=== After merge ==="
          find . -type f | sort

      # ⚠️ 产物完整性校验：每个编译模块在 4 平台目录都须有 .so/.pyd
      # （win32 缺 cloud_probe.pyd 的教训：编译失败被 compile.py 静默吞掉，
      #   Build job 仍 Success 导致残缺包发布）
      - name: Verify native binaries completeness
        working-directory: skill/dist/scripts/lib/_native
        run: |
          MISSING=0
          for mod in ak_1688_client ak_callback chrome_launcher config_store \
                     image_preprocessor ozon_scraper ozon_image_search \
                     reference_images ozon_discovery ozon_api stealth; do
            for plat in darwin-arm64 darwin-x86_64 linux win32; do
              if ! ls "$plat"/"$mod".* 2>/dev/null | grep -qE "\.(so|pyd)$"; then
                echo "❌ 缺失: $mod → $plat"
                MISSING=$((MISSING+1))
              fi
            done
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING 个二进制缺失，构建中止"
            exit 1
          fi
          echo "✅ 4 平台 × 11 模块 = 44 个二进制全部就位"

      - name: Clean and create package
        working-directory: skill/dist
        run: |
          rm -f data/config/stores.json data/config/settings.json
          find . -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Create distributable package
        working-directory: skill
        run: |
          VERSION=$(cat ../VERSION 2>/dev/null || echo "0.4.0")
          tar czf "pounding-ozon-probe-v${VERSION}.tar.gz" -C dist .
          ls -lh "pounding-ozon-probe-v${VERSION}.tar.gz"

      - name: Compute sha256 and generate manifest
        id: manifest
        working-directory: skill
        run: |
          VERSION=$(cat ../VERSION 2>/dev/null || echo "0.4.0")
          # ⚠️ 精确匹配版本包名（勿用 *.tar.gz：目录里有历史遗留旧包
          # 如 pounding-ozon-probe-darwin-arm64-py312.tar.gz，字母序排在
          # v 之前会被误选）
          PKG="pounding-ozon-probe-v${VERSION}.tar.gz"
          SHA=$(sha256sum "$PKG" | awk '{print $1}')
          cat > manifest.json <<EOF
          {"version": "$VERSION", "url": "${COS_MANIFEST_BASE_URL}/pounding-ozon-probe-v${VERSION}.tar.gz", "sha256": "$SHA", "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "notes": "自动更新发布（GitHub Actions v${VERSION}）"}
          EOF
          echo "PKG=$PKG"
          echo "SHA256: $SHA"
          cat manifest.json
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
        env:
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}

      # ⚠️ 分发直传 COS（v0.18.0 起）：不再依赖 skill-distribute 轮询
      # Release 资产（实测该链路 4 次全失败 + release 事件零运行记录）。
      # 包产出后同一 job 直接上传，带 3 次重试；失败即整体构建失败，
      # 不会出现"Release 有包但 COS 断供"的静默状态。
      - name: Install coscli
        working-directory: skill
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          chmod 755 coscli
          ./coscli --version

      - name: Upload package and manifest to COS
        timeout-minutes: 60
        working-directory: skill
        run: |
          PKG="${{ steps.manifest.outputs.package_name }}"
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.${COS_REGION}.myqcloud.com" \
              -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" \
              --init-skip=true --disable-log=true
          }
          # ⚠️ v0.19.2: coscli 无请求超时，跨境上传 TCP 黑洞会无限挂死
          # （v0.19.1 实测挂 8 小时）。用 GNU timeout 给每次尝试限 600s；
          # timeout 不能直接执行 shell 函数，需 bash -c 内联。
          UPLOADED=0
          for attempt in 1 2 3; do
            echo "⏳ COS 上传尝试 $attempt/3: ${PKG} + manifest.json"
            if timeout 600 bash -c 'c(){ ./coscli "$@" -e "cos.${COS_REGION}.myqcloud.com" -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" --init-skip=true --disable-log=true; }; c cp "$1" "cos://${COS_BUCKET}/ozon-skill/$1"' _ "${PKG}" \
               && timeout 600 bash -c 'c(){ ./coscli "$@" -e "cos.${COS_REGION}.myqcloud.com" -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY" --init-skip=true --disable-log=true; }; c cp "$1" "cos://${COS_BUCKET}/ozon-skill/$1"' _ "manifest.json"; then
              UPLOADED=1
              break
            fi
            [ "$attempt" -lt 3 ] && sleep 30
          done
          if [ "$UPLOADED" -ne 1 ]; then
            echo "::error::COS 上传 3 次均失败"
            exit 1
          fi
          echo "✅ 已上传: cos://${COS_BUCKET}/ozon-skill/${PKG} + manifest.json"
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}

      # ⚠️ 分发一致性校验：COS 包 sha256 必须与本地包一致、公网必须可访问。
      # （旧链路只校验 Release 资产，COS 上传超时/断供无人发现——掩耳盗铃）
      - name: Verify COS endpoints and sha256
        timeout-minutes: 10
        working-directory: skill
        run: |
          PKG="${{ steps.manifest.outputs.package_name }}"
          BASE="${COS_MANIFEST_BASE_URL:-https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/ozon-skill}"
          for URL in "${BASE}/manifest.json" "${BASE}/${PKG}"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "GET $URL → HTTP $CODE"
            test "$CODE" = "200" || { echo "::error::COS 公网端点不可访问"; exit 1; }
          done
          LOCAL_SHA=$(sha256sum "$PKG" | awk '{print $1}')
          REMOTE_SHA=$(curl -s -L "${BASE}/${PKG}" | sha256sum | awk '{print $1}')
          echo "local=${LOCAL_SHA}"
          echo "remote=${REMOTE_SHA}"
          test "$LOCAL_SHA" = "$REMOTE_SHA" || {
            echo "::error::COS 包 sha256 与本地不一致（上传损坏）"; exit 1; }
          echo "✅ COS 分发完成: ${PKG}（sha256 一致）"
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_MANIFEST_BASE_URL: ${{ secrets.COS_MANIFEST_BASE_URL }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pounding-ozon-probe
          # ⚠️ 只上传版本包：仓库根有历史遗留旧包（pounding-ozon-probe-
          # darwin-arm64-py312.tar.gz 等）会被 glob 匹配混入 Release
          path: skill/pounding-ozon-probe-v*.tar.gz
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 精确匹配版本包，勿用 *.tar.gz（会带上历史遗留残缺旧包）
          files: skill/pounding-ozon-probe-v*.tar.gz
          generate_release_notes: true
