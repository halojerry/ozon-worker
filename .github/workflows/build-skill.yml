name: Build Skill Binary Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'skill/**'
    branches: [main]

jobs:
  build-macos-arm64:
    name: macOS arm64 (py${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cython setuptools && pip install -r skill/requirements.txt
      - working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: native-darwin-arm64-py${{ matrix.python-version }}
          path: skill/dist/scripts/lib/_native/darwin/
          retention-days: 7

  build-macos-x86_64:
    name: macOS x86_64 (py${{ matrix.python-version }})
    runs-on: macos-13
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cython setuptools && pip install -r skill/requirements.txt
      - working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: native-darwin-x86_64-py${{ matrix.python-version }}
          path: skill/dist/scripts/lib/_native/darwin/
          retention-days: 7

  build-windows:
    name: Windows amd64 (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cython setuptools && pip install -r skill/requirements.txt
      - working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: native-win32-py${{ matrix.python-version }}
          path: skill/dist/scripts/lib/_native/win32/
          retention-days: 7

  build-windows-arm64:
    name: Windows arm64 (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install cython setuptools
          pip install -r skill/requirements.txt
      - name: Compile for Windows ARM64
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-win-arm64-py${{ matrix.python-version }}
          path: skill/dist/scripts/lib/_native/win32/
          retention-days: 7

  build-linux:
    name: Linux amd64 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install cython setuptools
          pip install -r skill/requirements.txt
      - name: Compile for Linux
        working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-py${{ matrix.python-version }}
          path: skill/dist/scripts/lib/_native/
          retention-days: 7

  package:
    name: Package unified binary
    needs: [build-macos-arm64, build-windows, build-windows-arm64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cython setuptools

      - working-directory: skill
        run: python compile.py
        env:
          PYTHONIOENCODING: utf-8

      # Download all platform artifacts (py3.12 only)
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64-py3.12
          path: skill/dist/scripts/lib/_native/darwin-arm64-py312/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: native-darwin-x86_64-py3.12
          path: skill/dist/scripts/lib/_native/darwin-x86_64-py312/
      - uses: actions/download-artifact@v4
        with:
          name: native-win32-py3.12
          path: skill/dist/scripts/lib/_native/win32-py312/
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64-py3.12
          path: skill/dist/scripts/lib/_native/win-arm64-py312/
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-py3.12
          path: _linux/

      # Merge all into unified _native structure
      # stub uses platform.machine() to pick correct binary
      - name: Merge binaries
        working-directory: skill/dist/scripts/lib/_native
        run: |
          # macOS arm64
          mkdir -p darwin-arm64
          cp darwin-arm64-py312/* darwin-arm64/ 2>/dev/null || true
          # macOS x86_64
          mkdir -p darwin-x86_64
          cp darwin-x86_64-py312/* darwin-x86_64/ 2>/dev/null || true
          # Windows amd64
          mkdir -p win32
          cp win32-py312/* win32/ 2>/dev/null || true
          # Windows arm64
          mkdir -p win-arm64
          cp win-arm64-py312/* win-arm64/ 2>/dev/null || true
          # Linux
          mkdir -p linux
          cp -r ../../../_linux/scripts/lib/_native/linux/* linux/ 2>/dev/null || true
          # Cleanup temp dirs
          rm -rf darwin-arm64-py312 darwin-x86_64-py312 win32-py312 win-arm64-py312
          echo "=== Final _native structure ==="
          find . -type f | sort

      - name: Clean test data
        working-directory: skill/dist
        run: |
          rm -f data/config/stores.json data/config/settings.json
          find . -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Create distributable package
        working-directory: skill
        run: |
          VERSION=$(cat ../VERSION 2>/dev/null || echo "0.3.0")
          tar czf "pounding-ozon-probe-v${VERSION}.tar.gz" -C dist .
          ls -lh "pounding-ozon-probe-v${VERSION}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pounding-ozon-probe
          path: skill/pounding-ozon-probe-*.tar.gz
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: skill/pounding-ozon-probe-*.tar.gz
          generate_release_notes: true