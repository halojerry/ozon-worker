name: CI — Code Quality & Test

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'skill/data/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'skill/data/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════
  # Job 1: 语法检查（阻断，最快 — 先跑）
  # ═══════════════════════════════════════
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check all Python files
        run: |
          echo "🔍 语法检查..."
          FAILED=0
          while IFS= read -r -d '' f; do
            case "$f" in
              */.venv/*|*/__pycache__/*|*/.pytest_cache/*|*/node_modules/*|*/dist/*|*/build/*)
                continue ;;
            esac
            python -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>/dev/null || {
              echo "❌ $f"
              FAILED=1
            }
          done < <(find . -name "*.py" -not -path "./.venv/*" -print0)
          if [ $FAILED -ne 0 ]; then
            echo "::error::语法检查失败"
            exit 1
          fi
          echo "✅ 全部通过"

  # ═══════════════════════════════════════
  # Job 2: Ruff Lint + Import Check
  # ═══════════════════════════════════════
  lint:
    name: Lint & Import
    runs-on: ubuntu-latest
    needs: syntax
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install ruff pydantic

      - name: Ruff check
        run: |
          ruff check src/ --select E,F,W --ignore E501

      - name: Import check
        run: |
          PYTHONPATH=src python -c "
          from api.errors import WorkerErrorCode, error_response
          from api.schemas import SubmitTaskRequest
          print('✅ Worker 核心模块导入 OK')
          "

  # ═══════════════════════════════════════
  # Job 3: 单元测试
  # ═══════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short \
            -k "not db and not integration and not slow" \
            --timeout=60 2>&1 || echo "::warning::部分测试跳过（需要 DB）"

  # ═══════════════════════════════════════
  # Job 4: Docker Build
  # ═══════════════════════════════════════
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          VERSION=${GITHUB_REF##*/}-${GITHUB_SHA::7}
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ozon-worker:ci \
            -f worker/Dockerfile worker/

      - name: Verify health
        run: |
          docker run -d --name ozon-test -p 5000:5000 \
            -e PGDATABASE_URL=postgresql://test:test@localhost:5432/test \
            ozon-worker:ci || true
          echo "::notice::Docker build 成功（完整启动需要 PG）"
