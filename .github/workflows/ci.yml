name: CI — Syntax, Lint, Test & Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['**.md', 'docs/**', 'skill/data/**', 'deploy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'skill/data/**', 'deploy/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════
  # Job 1: 语法检查（最快，先阻断）
  # ═══════════════════════════
  syntax:
    name: Syntax — All .py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: |
          FAILED=0 TOTAL=0
          while IFS= read -r -d '' f; do
            case "$f" in
              */.venv/*|*/__pycache__/*|*/.pytest_cache/*|*/dist/*|*/build/*|*/site-packages/*|*/.git/*) continue ;;
            esac
            TOTAL=$((TOTAL+1))
            python -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>/dev/null || { echo "❌ $f"; FAILED=1; }
          done < <(find . -name "*.py" -not -path "./.venv/*" -not -path "./.git/*" -print0)
          echo "文件: $TOTAL, 错误: $FAILED"
          [ $FAILED -ne 0 ] && exit 1

  # ═══════════════════════════
  # Job 2: Lint — Worker + Skill
  # ═══════════════════════════
  lint:
    name: Ruff — Worker & Skill
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff

      # Worker: 格式错误阻断
      - name: Ruff Worker (E,F,W)
        run: ruff check worker/src/ --select E,F,W --ignore E501
        continue-on-error: false

      # Worker: 质量建议（非阻断）
      - name: Ruff Worker (import order)
        run: ruff check worker/src/ --select I --ignore I001 --statistics 2>&1 | head -20
        continue-on-error: true

      # Skill: 格式错误阻断
      - name: Ruff Skill (E,F,W)
        run: ruff check skill/scripts/ --select E,F,W --ignore E501,E402
        continue-on-error: false

  # ═══════════════════════════
  # Job 3: 导入验证
  # ═══════════════════════════
  imports:
    name: Import Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Worker 核心导入
      - name: Worker imports
        run: |
          cd worker
          pip install pydantic fastapi sqlalchemy -q
          PYTHONPATH=src python -c "
          from api.errors import WorkerErrorCode, error_response
          from api.schemas import SubmitTaskRequest, TaskStatusResponse
          print('✅ Worker 核心模块')
          "

      # Skill 核心导入
      - name: Skill imports
        run: |
          cd skill
          pip install requests websocket-client Pillow -q
          PYTHONPATH=scripts python -c "
          from scripts.lib.utils import parse_price
          from scripts._const import CLOUD_API_BASE
          print('✅ Skill 核心模块')
          "

  # ═══════════════════════════
  # Job 4: 单元测试
  # ═══════════════════════════
  test:
    name: Tests — Worker
    runs-on: ubuntu-latest
    needs: imports
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install deps
        run: pip install pydantic fastapi sqlalchemy pytest pytest-asyncio -q 2>&1

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short \
            -k "not db and not integration and not slow" \
            --timeout=60 2>&1 || true

  # ═══════════════════════════
  # Job 5: Docker Build
  # ═══════════════════════════
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t ozon-worker:ci -f worker/Dockerfile worker/
          docker images ozon-worker:ci --format '镜像: {{.Size}}'
          echo "✅ Docker build 成功"
