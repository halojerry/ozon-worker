name: CI — Syntax, Lint, Test & Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['**.md', 'docs/**', 'skill/data/**', 'deploy/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'skill/data/**', 'deploy/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══ Syntax: 全量 .py（阻断，~10s）═══
  syntax:
    name: Syntax — All .py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
        errors=$(find . -name "*.py" \
          -not -path "./.venv/*" -not -path "./.git/*" \
          -not -path "*/__pycache__/*" -not -path "*/.pytest_cache/*" \
          -not -path "*/dist/*" -not -path "*/build/*" -not -path "*/site-packages/*" \
          -exec sh -c 'python3 -c "import py_compile; py_compile.compile(\"$1\",doraise=True)" 2>/dev/null || echo $1' _ {} \;)
        if [ -n "$errors" ]; then
          echo "$errors" | head -20
          echo "::error::语法错误"
          exit 1
        fi
        echo "✅ 语法通过"

  # ═══ Ruff: Worker + Skill (阻断) ═══
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff
      - run: ruff check worker/src/ --select E,F,W --ignore E501
      - run: ruff check skill/scripts/ --select E,F,W --ignore E501,E402

  # ═══ Import: Worker + Skill (阻断) ═══
  imports:
    name: Import Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Worker imports
        run: |
          pip install pydantic fastapi sqlalchemy -q
          cd worker && PYTHONPATH=src python -c "
          from api.errors import WorkerErrorCode, error_response
          from api.schemas import SubmitTaskRequest, TaskStatusResponse
          print('✅ Worker 核心模块')
          "

      - name: Skill imports
        run: |
          pip install requests websocket-client Pillow -q
          cd skill && PYTHONPATH=scripts python -c "
          from scripts.lib.utils import parse_price
          from scripts._const import CLOUD_API_BASE
          print('✅ Skill 核心模块')
          "

  # ═══ Tests: Worker (非阻断) ═══
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: imports
    defaults: { run: { working-directory: worker } }
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pydantic fastapi sqlalchemy pytest pytest-asyncio -q
      - run: PYTHONPATH=src pytest tests/ -v --tb=short -k "not db and not integration and not slow" --timeout=60

  # ═══ Docker Build ═══
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ozon-worker:ci -f worker/Dockerfile worker/ && echo "✅ Docker build 成功"
