
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ozon123}
      POSTGRES_DB: ${POSTGRES_DB:-ozon}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozon"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    ports:
      - "8080:5000"
    env_file:
      - .env
    environment:
      - PGDATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ozon123}@postgres:5432/${POSTGRES_DB:-ozon}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - APP_WORKSPACE_PATH=/app
      - PYTHONPATH=/opt/venv/lib/python3.12/site-packages:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m src.main -m http -p 5000

volumes:
  pgdata:
