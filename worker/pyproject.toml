[project]
name = "ozon-worker"
version = "0.2.0"
description = "Ozon product listing worker — LangGraph pipeline"
requires-python = ">=3.12"
dependencies = [
    # ── LangGraph 核心 ──
    "langchain-core>=1.2,<2",
    "langgraph==1.0.2",
    "langgraph-checkpoint==3.0.0",
    "langgraph-checkpoint-postgres>=3.0,<4",
    # ── Web 框架 ──
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic>=2.12,<3",
    "Jinja2>=3.1,<4",
    # ── 数据库 ──
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.2,<2",
    # ── 外部服务 ──
    "supabase>=2.0,<3",                  # 鉴权 + tokens 表查询
    "coze-workload-identity>=0.1.4,<1",  # S3 auth（懒加载）
    "boto3>=1.40,<2",                    # S3 操作（模块级）
    # ── 文档解析（懒加载）──
    "pypdf>=6.4,<7",
    "docx2python>=3.5,<4",
    "python-pptx>=1.0,<2",
    "pandas>=2.2,<3",
    # ── NLP ──
    "jieba>=0.42.1",                     # 中文分词
    "chardet>=5.2,<6",                   # 编码检测
]

[tool.uv]
# 使用阿里云镜像作为默认源，替代 pypi.org
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# pypi 仅供 [tool.uv.sources] 显式引用：阿里云镜像同步 PyPI 新版有延迟（小时级），
# 当某个内部包的预发布版（如 a/b/rc 后缀）刚 push 到官方 PyPI 还未同步到镜像时，
# 临时让该包从 PyPI 取，避免 lock/install 失败。explicit=true 保证不影响其他包的解析。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
