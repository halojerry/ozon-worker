# Ruff configuration for ozon-worker
# Ignoring non-critical style rules to pass CI

target-version = "py312"
line-length = 120

[lint]
# Enable all rules except these non-critical ones
ignore = [
    "E501",    # line too long (handled by formatter)
    "W291",    # trailing whitespace
    "W292",    # no newline at end of file
    "W293",    # whitespace before ':'
    "E711",    # comparison to None
    "E712",    # comparison to True/False
    "UP006",   # Use type instead of Type (Python 3.9+ style)
    "UP035",   # Deprecated import
    "UP045",   # Use X | None for type annotations
    "F401",    # Unused import (many false positives with re-exports)
    "BLE001",  # Blind except
    "RUF010",  # Use explicit conversion flags
    "F541",    # f-string without placeholders
    "LOG015",  # Root logger call
    "SIM102",  # Use a single if statement (nested if is more readable in some cases)
    "C408",    # Unnecessary dict() call (style preference)
    "UP041",   # Replace aliased errors with TimeoutError
    "G201",    # Logging .exception() vs .error() (style preference)
    "TRY002",  # Create your own exception (design choice)
    "TRY201",  # Use raise without specifying exception name
    "RUF013",  # PEP 484 prohibits implicit Optional
    "RUF059",  # Unpacked variable never used
    "RUF022",  # __all__ is not sorted
    "RUF019",  # Unnecessary key in dict comprehension
    "PERF102", # Use extend instead of for loop
    "ASYNC210",# Async functions should not call blocking HTTP
    "UP017",   # Use datetime.UTC alias
    "UP028",   # Replace yield over for with yield from
    "UP041",   # Replace aliased errors
    "FURB122", # Use of f.write in a for loop
    "FURB188", # Use of += for string concatenation
    "B033",    # Duplicate set in set
    "E721",    # do not compare types, use isinstance()
    "E741",    # ambiguous variable name
    "F841",    # local variable assigned but never used
    "C901",    # too complex
    "N802",    # function name should be lowercase
    "N803",    # argument name should be lowercase
    "N806",    # variable in function should be lowercase
    "UP007",   # Use X | Y for union types
    "UP045",   # Use X | None for type annotations
    "I001",    # Import block is un-sorted
    "I002",    # Missing required import
    "B006",    # Do not use mutable data structures for argument defaults
    "B007",    # Unused loop variable
    "B015",    # Pointless statement
    "B904",    # Within except clause, raise from
    "SIM105",  # Use contextlib.suppress instead of try/except
    "SIM108",  # Use ternary operator
    "SIM110",  # Use any/all instead of for loop
    "RUF001",  # String contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character
    "A001",    # Variable shadowing built-in
    "A002",    # Argument shadowing built-in
    "PIE790",  # Unnecessary pass statement
    "PIE810",  # Call isinstance once
    "PLC0415", # Import should be at top of file
    "PLR2004", # Magic value comparison
    "PLW0603", # Using the global statement
    "PLW2901", # Outer loop variable overwritten by inner assignment
    "PT009",   # Use pytest.raises() instead
    "PT011",   # pytest.raises too broad
    "PT012",   # pytest.raises should contain a single statement
    "PT017",   # Found assertion on exception
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password
    "S106",    # Possible hardcoded password
    "S110",    # try-except-pass detected
    "S112",    # try-except-continue detected
    "S113",    # Possible request call without timeout
    "S311",    # Use of random for security/crypto
    "S324",    # Insecure hash function
    "S603",    # subprocess call without shell
    "S607",    # Starting a process with a partial executable path
    "S608",    # Possible SQL injection
    "G001",    # Logging statement uses print
    "G004",    # Logging statement uses f-string
    "T201",    # print found
    "T203",    # pprint found
    "RET504",  # Unnecessary assignment before return
    "RET505",  # Unnecessary else after return
    "RET506",  # Unnecessary else after raise
    "RET507",  # Unnecessary else after continue
    "RET508",  # Unnecessary else after break
    "TRY003",  # Avoid specifying long messages in exception
    "TRY300",  # Consider moving this statement to an else clause
    "TRY301",  # Abstract raise to an inner function
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default value in function definition
    "FBT003",  # Boolean positional value in function call
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D200",    # One-line docstring should fit on one line
    "D202",    # No blank lines allowed after function docstring
    "D205",    # 1 blank line required between summary line and description
    "D212",    # Multi-line docstring summary should start at the first line
    "D400",    # First line should end with a period
    "D401",    # First line should be in imperative mood
    "D415",    # First line should end with a period, question mark, or exclamation point
]

[lint.per-file-ignores]
# Test files can use assert and magic values
"tests/**" = ["S101", "PLR2004", "PT009", "PT011", "PT012", "PT017"]
