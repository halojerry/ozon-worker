[project]
name = "pounding-mcp"
version = "0.70.0"
description = "MCP server for the ozon-worker stack: 25 tools (20 skill CLI wrappers + 5 worker REST direct calls) for 1688/Ozon sourcing and listing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
]

[project.scripts]
pounding-mcp = "pounding_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pounding_mcp"]
