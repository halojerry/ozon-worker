[project]
name = "pounding-mcp"
version = "0.1.0"
description = "MCP server wrapping the ozon-worker skill CLI (19 commands) for DeepSeek Harness"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
]

[project.scripts]
pounding-mcp = "pounding_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pounding_mcp"]
