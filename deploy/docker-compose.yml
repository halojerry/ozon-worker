# 生产环境 Docker Compose
# 用法: cp .env.example .env && vim .env && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ozon}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozon"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ozon-worker:${VERSION:-latest}
    restart: unless-stopped
    # ✅ v0.29(PRD-cicd-stability): 优雅关闭 — 给运行中任务 5 分钟排空时间
    # (FastAPI lifespan drain + worker_loop 停拉新任务; 默认 10s 会强杀任务)
    stop_grace_period: 5m
    ports:
      - "0.0.0.0:8080:5000"
    env_file:
      - .env
    environment:
      - PGDATABASE_URL=${PGDATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ozon}}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - APP_WORKSPACE_PATH=/app
      # v0.29.1: 修复② — 多阶段镜像依赖装在 /opt/venv, 原 /app/src 覆盖
      # PYTHONPATH 导致 uvicorn/依赖找不到(容器重启)。compose 需保留镜像 venv 路径。
      - PYTHONPATH=/opt/venv/lib/python3.12/site-packages:/app/src
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - LOG_FILE=${LOG_FILE:-/app/logs/worker.log}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - logs:/app/logs
      # ⚠️ v0.15: config 目录 bind mount → 宿主机改配置（如 image_prompts.json / LLM cfg）无需重建镜像/重启容器，下一次调用即生效
      - ../worker/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pgdata:
  logs:
