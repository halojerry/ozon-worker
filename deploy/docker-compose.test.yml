# 本地/CI 测试环境(PRD M5):PG + worker-test(init_data → pytest)
# 用法: docker compose -f docker-compose.test.yml up -d postgres
#       bash scripts/test-docker.sh
# ✅ v0.77.2: 显式 project name 隔离——本文件与 docker-compose.yml 同目录，默认
#    project 名同为 `deploy`，test-docker.sh 的 `up -d postgres` 会把 deploy 栈的
#    postgres 容器按测试配置重建（实测翻转 5433/15433 端口与凭证，deploy worker
#    因 DB 换台 unhealthy）。加 name 后测试容器归 ozon-worker-test 项目，互不可见。
name: ozon-worker-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ozon123
      POSTGRES_DB: ozon
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozon"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker-test:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      PGDATABASE_URL: postgresql://postgres:ozon123@postgres:5432/ozon
      APP_WORKSPACE_PATH: /app
      PYTHONPATH: /opt/venv/lib/python3.12/site-packages:/app/src
      CREDENTIAL_MASTER_KEY: 0123456789abcdef0123456789abcdef
      SKIP_ZOMBIE_RECOVERY: "1"
      SKIP_FAILED_REVIVE: "1"
      # v0.63.1: 会话结束后清空业务表，防测试残留污染同库 worker 运行态
      TEST_DB_CLEANUP: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../worker/tests:/app/tests
      # v0.62: webui 源码挂载 — test_webui_contract 按 __file__ 相对路径解析
      # WEBUI_SRC（容器内 /app/tests → /webui/src），缺挂载时扫描为空误报。
      - ../webui:/webui:ro
    command: >
      sh -c "python scripts/init_data.py &&
             python -m pytest tests/ -q -p no:cacheprovider"

volumes:
  pgdata_test:
