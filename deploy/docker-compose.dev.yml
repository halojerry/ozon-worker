# 本地开发环境 Docker Compose
# 用法: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ozon123
      POSTGRES_DB: ozon
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozon"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
